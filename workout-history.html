<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workout History - Muscle Recovery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="titlebar">
        <div>
          <p class="eyebrow">Body Comp</p>
          <h1>Workout History</h1>
        </div>
        <nav class="view-toggle workout-nav" aria-label="Workout navigation">
          <a href="workout.html">Log workout</a>
          <a href="front_view.html">Recovery map</a>
        </nav>
      </header>
      <section class="workout-page">
        <div class="panel history-panel">
          <div class="workout-heading">
            <div>
              <p class="eyebrow">Saved sessions</p>
              <h2>Review and edit</h2>
            </div>
          </div>
          <p id="historyStatus" class="form-status" role="status">
            Loading workout history...
          </p>
          <div
            id="workoutHistory"
            class="workout-exercises"
            aria-live="polite"
          ></div>
        </div>
      </section>
    </main>
    <script src="nav-config.js"></script>
    <script src="nav-utils.js"></script>
    <script src="api.js"></script>
    <script src="workout-history.js"></script>
    <style>
      .confirm-dialog {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.55);
        z-index: 1000;
      }
      .confirm-content {
        background: var(--card-bg, var(--bg-subtle, #1b1b1b));
        border: 1px solid var(--border, #2b2b2b);
        border-radius: 10px;
        padding: 28px 32px 24px;
        max-width: 360px;
        text-align: center;
      }
      .confirm-subtext {
        color: var(--text-muted, #6b6b6b);
        font-size: 0.9rem;
        margin: 6px 0 16px;
      }
      .confirm-actions {
        display: flex;
        gap: 12px;
        justify-content: center;
      }
    </style>
  </body>
</html>
