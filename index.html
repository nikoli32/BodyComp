<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Body Comp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="titlebar">
        <div>
          <p class="eyebrow">Body Comp</p>
          <h1>Muscle Recovery Map</h1>
        </div>
        <div class="view-toggle" aria-label="Body view">
          <button id="frontView" class="active" type="button">Front</button>
          <button id="backView" type="button" disabled title="Back view coming later">Back</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="sidebar" aria-label="Recovery summary">
          <section class="panel">
            <h2>Recovery</h2>
            <div class="stat-grid">
              <article>
                <span>Last workout</span>
                <strong>3d</strong>
              </article>
              <article>
                <span>Fresh groups</span>
                <strong id="totalGroups">0</strong>
              </article>
            </div>
          </section>

          <section class="panel">
            <h2>Muscle Groups</h2>
            <div id="muscleList" class="muscle-list"></div>
          </section>
        </aside>

        <section class="model-panel" aria-label="Interactive front body muscle map">
          <div class="canvas-toolbar">
            <div>
              <span id="visibleSide">Front view</span>
              <strong id="muscleName">Full Body</strong>
            </div>
            <button id="resetView" class="icon-button" type="button" aria-label="Reset selected muscle" title="Reset selected muscle">
              &#8634;
            </button>
          </div>

          <div class="canvas-wrap">
            <canvas id="muscleCanvas" aria-label="Clickable front-facing human muscle map"></canvas>
          </div>
        </section>

        <aside class="details-panel" aria-label="Selected muscle details">
          <section class="panel selected-card">
            <p class="eyebrow">Selected Muscle</p>
            <h2 id="detailTitle">Full Body</h2>
            <p id="muscleDescription">
              Hover over a muscle group to highlight it. Click a region to focus the view and inspect that group.
            </p>
          </section>

          <section class="panel">
            <h2>Composition</h2>
            <div class="metric-list">
              <article>
                <span>Body fat</span>
                <strong>20.4%</strong>
              </article>
              <article>
                <span>Weight</span>
                <strong>178 lb</strong>
              </article>
              <article>
                <span>Lean mass</span>
                <strong>142 lb</strong>
              </article>
            </div>
          </section>
        </aside>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
