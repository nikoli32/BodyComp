<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Body Comp</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="titlebar">
        <div>
          <p class="eyebrow">Body Comp</p>
          <h1>Muscle Recovery Map</h1>
        </div>
        <div class="auth-section">
          <a id="signInButton" href="auth.html" class="text-button">Sign in</a>
          <div id="profileSection" class="profile-section" hidden>
            <button id="profileMenuButton" class="profile-button" aria-label="User profile menu" aria-expanded="false" aria-haspopup="true">
              <span class="profile-avatar" id="profileAvatar"></span>
            </button>
            <div id="profileDropdown" class="profile-dropdown" hidden role="menu">
              <div class="profile-info">
                <p id="profileName" class="profile-name"></p>
                <p id="profileEmail" class="profile-email"></p>
              </div>
              <hr class="profile-divider" />
              <button id="profileLink" class="profile-menu-item" role="menuitem">View Profile</button>
              <button id="logoutButton" class="profile-menu-item" role="menuitem">Logout</button>
            </div>
          </div>
        </div>
      </header>

      <section class="home-page">
        <div class="welcome-section">
          <h2>Welcome to Muscle Recovery Map</h2>
          <p>Explore your body's recovery status with detailed muscle maps</p>
        </div>

        <div class="view-buttons">
          <a href="front_view.html" class="view-button">
            <span class="button-icon" aria-hidden="true">&#8593;</span>
            <span class="button-text">Front View</span>
          </a>
          <a href="back_view.html" class="view-button">
            <span class="button-icon" aria-hidden="true">&#8595;</span>
            <span class="button-text">Back View</span>
          </a>
          <a href="workout.html" class="view-button">
            <span class="button-icon" aria-hidden="true">+</span>
            <span class="button-text">Log Workout</span>
          </a>
        </div>

        <section class="panel recovery-summary">
          <h2>Recovery Status</h2>
          <div class="stat-grid">
            <article>
              <span>Last workout</span>
              <strong id="lastWorkout">—</strong>
            </article>
            <article>
              <span>Fresh groups</span>
              <strong id="totalGroups">&mdash;</strong>
            </article>
          </div>
        </section>
        <p id="apiStatus" class="api-status" role="status">Loading recovery data…</p>
      </section>
    </main>
    <script src="nav-config.js"></script>
    <script src="nav-utils.js"></script>
    <script src="api.js"></script>
    <script src="index.js"></script>
    <script src="dashboard.js"></script>
  </body>
</html>
